
name: Documentation

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Documentation version (e.g. 1.1.0)"
        required: true
        type: string
      make_default:
        description: "Make this the default version?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install zensical
          pip install git+https://github.com/squidfunk/mike.git

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Deploy documentation
        run: |
          mike deploy --push "${{ inputs.version }}"

      - name: Set default version
        if: ${{ inputs.make_default }}
        run: |
          mike set-default --push "${{ inputs.version }}"
